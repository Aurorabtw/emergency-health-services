name: hospital_services
description: "Emergency Healthcare Access Platform - Unified emergency management system"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Firebase
  firebase_core: ^4.12.1
  firebase_auth: ^6.5.6
  cloud_firestore: ^6.7.1

  # State Management
  provider: ^6.1.5+1

  # Routing
  go_router: ^17.3.0

  # Maps & Location
  google_maps_flutter: ^2.14.2
  google_maps_flutter_web: ^0.5.12
  geolocator: ^14.0.3
  geolocator_web: ^4.1.1

  # Cloudinary (image uploads)
  http: ^1.4.0

  # Utilities
  intl: ^0.20.3
  uuid: ^4.6.0
  image_picker: ^1.2.3
  url_launcher: ^6.3.2
  cached_network_image: ^3.4.1
  timeago: ^3.7.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
