name: Verify and Deploy Firebase

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  verify:
    concurrency:
      group: verify-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - run: npm ci
      - name: Test Firestore security rules
        run: npm test

      - uses: subosito/flutter-action@v2
        with:
          # Pinned to the locally tested version for reproducible builds.
          flutter-version: 3.44.9
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
      - run: flutter build web --release --pwa-strategy=none --no-web-resources-cdn

      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push'
        with:
          name: web-build
          path: build/web
          retention-days: 1

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    concurrency:
      group: firebase-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: web-build
          path: build/web

      - name: Require deploy credential
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_HEALTH_HUB_SDP4 }}
        run: |
          if [ -z "$SA" ]; then
            echo "::error::FIREBASE_SERVICE_ACCOUNT_HEALTH_HUB_SDP4 is not configured"
            exit 1
          fi

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_HEALTH_HUB_SDP4 }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Deploy Firestore rules and indexes
        run: >-
          npx firebase-tools@15.26.0 deploy
          --only firestore:rules,firestore:indexes
          --project health-hub-sdp4
          --non-interactive

      - name: Wait for Firestore indexes
        run: |
          for attempt in $(seq 1 60); do
            states=$(gcloud firestore indexes composite list --project=health-hub-sdp4 --filter="collectionGroup=booking_requests" --format="value(state)")
            if [ -n "$states" ] && ! echo "$states" | grep -qv '^READY$'; then
              exit 0
            fi
            echo "Firestore indexes are still building (attempt $attempt/60)."
            sleep 10
          done
          echo "::error::Firestore indexes did not become ready within 10 minutes"
          exit 1

      - name: Deploy Hosting
        run: >-
          npx firebase-tools@15.26.0 deploy
          --only hosting
          --project health-hub-sdp4
          --non-interactive
